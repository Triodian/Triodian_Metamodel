name: Validate schemas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Structural checks (blocking)
        run: python scripts/validate.py

      # Reports drift between the documentation's worked examples and the schemas.
      # Non-blocking until the known drift is resolved; remove continue-on-error then.
      - name: Documentation examples (report only)
        continue-on-error: true
        run: python scripts/validate.py --only-doc-examples
