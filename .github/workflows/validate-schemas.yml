name: Validate schemas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Structural checks (blocking)
        run: python scripts/validate.py

      - name: Shared vocabulary report is up to date (blocking)
        run: |
          python scripts/vocabulary_map.py
          git diff --exit-code docs/ || (echo "Run python scripts/vocabulary_map.py and commit the result" && exit 1)

      - name: Shared concepts use the shared vocabulary (blocking)
        run: python scripts/vocabulary_map.py --check

      - name: Documentation examples (blocking)
        run: python scripts/validate.py --only-doc-examples
